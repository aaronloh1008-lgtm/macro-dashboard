name: Deploy dashboard to GitHub Pages

# Builds the macro dashboard in the cloud (GitHub runners have full internet, so
# every feed is live — unlike a laptop sandbox) and publishes it as an
# installable PWA on GitHub Pages. Independent of Netlify / the alert bot.
on:
  workflow_dispatch:            # manual run from the Actions tab
  push:
    branches: [ main ]          # redeploy whenever dashboard.py changes
  schedule:
    - cron: "*/15 * * * *"      # refresh the data every 15 min (GitHub best-effort)

# GitHub Pages deployment needs these permissions + an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; drop stale queued builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Generate the page straight into site/index.html, then drop the PWA
      # manifest + icons beside it so "Add to Home Screen" / "Install" works.
      - name: Generate dashboard + assemble PWA
        run: |
          mkdir -p site
          DASH_OUT=site/index.html python3 dashboard.py
          cp public/manifest.webmanifest site/
          cp public/icon-192.png site/
          cp public/icon-512.png site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

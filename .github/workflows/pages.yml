name: Deploy dashboard to GitHub Pages

# Publishes the STATIC SHELL (public/index.html + manifest + icons) to GitHub
# Pages. The shell contains no data — it fetches the freshest bake from the
# `live` branch via raw.githubusercontent.com (see bake.yml).
#
# Deploys happen ONLY on code changes. High-frequency Pages deploys are what
# wedged the site twice (2026-06-30 at 2-min cadence, 2026-07-02 at 5-min:
# deployments report success while the served content freezes for hours).
# Data freshness no longer depends on this workflow at all.
on:
  workflow_dispatch:            # manual redeploy from the Actions tab
  push:
    branches: [ main ]          # redeploy when the shell / manifest / code changes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static shell
        run: |
          mkdir -p site
          cp public/index.html site/
          cp public/manifest.webmanifest site/
          cp public/icon-192.png site/
          cp public/icon-512.png site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
